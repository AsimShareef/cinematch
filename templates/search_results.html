{% extends "base.html" %}
{% block title %}Search — CineMatch{% endblock %}

{% block content %}
  <h1 class="h4 mb-4">Search results<span id="search-query-label"></span></h1>
  <div id="search-grid"></div>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/movies.js') }}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const q = (params.get('q') || '').trim();
      const grid = document.getElementById('search-grid');

      if (!q) {
        grid.innerHTML = '<div class="empty-state w-100">Type something in the search box above.</div>';
        return;
      }

      document.getElementById('search-query-label').textContent = ` for "${q}"`;
      grid.innerHTML = cinemaLoaderHtml('Searching the archive...');

      const { ok, body } = await searchMovies(q);
      grid.className = 'row';
      if (ok) {
        renderMovieGrid(grid, body.movies);
      } else {
        grid.innerHTML = '<div class="empty-state w-100">Search failed. Try again.</div>';
      }
    });
  </script>
{% endblock %}
