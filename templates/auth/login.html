{% extends "base.html" %}
{% from "_icons.html" import icon_ticket %}
{% block title %}Log in — CineMatch{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-sm-8 col-md-6 col-lg-4">
      <div class="glass glass-strong glass-panel">
        <div class="text-center mb-3" style="color: var(--accent-cyan);">{{ icon_ticket("auth-icon") }}</div>
        <h1 class="h4 mb-4 text-center">Log in</h1>
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" required>
          </div>
          <div class="text-danger small mb-3" id="login-error"></div>
          <button type="submit" class="btn btn-glass w-100">Log in</button>
        </form>
        <p class="mt-3 small text-muted text-center mb-0">No account? <a href="/register">Sign up</a></p>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      handleLogin(email, password, document.getElementById('login-error'));
    });
  </script>
{% endblock %}
