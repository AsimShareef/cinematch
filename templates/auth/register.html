{% extends "base.html" %}
{% from "_icons.html" import icon_clapper %}
{% block title %}Sign up — CineMatch{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-sm-8 col-md-6 col-lg-4">
      <div class="glass glass-strong glass-panel">
        <div class="text-center mb-3" style="color: var(--accent-amber);">{{ icon_clapper("auth-icon") }}</div>
        <h1 class="h4 mb-4 text-center">Create an account</h1>
        <form id="register-form">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input type="text" class="form-control" id="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" required minlength="6">
          </div>
          <div class="text-danger small mb-3" id="register-error"></div>
          <button type="submit" class="btn btn-glass w-100">Sign up</button>
        </form>
        <p class="mt-3 small text-muted text-center mb-0">Already have an account? <a href="/login">Log in</a></p>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      handleRegister(username, email, password, document.getElementById('register-error'));
    });
  </script>
{% endblock %}
